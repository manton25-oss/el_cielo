<!DOCTYPE html>
<html lang="es-ES">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Merce Antón">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

  <link rel="shortcut icon" href="img/clouds.svg" type="image/x-icon">
    <link rel="apple-touch-icon" href="img/clouds.svg" sizes="192x192">
    <link rel="icon" href="img/clouds.svg">

  <link rel="stylesheet" href="cielo_styles.css">
  <title>El cielo en tu vida</title>
</head>

<body>

  <main>
    <div class="tarjeta">
      <header>
        <h1>El cielo en tu vida</h1>
        <p class="frase">Descubre qué está pasando sobre tu cabeza</p>
        <button id="btnUbi">Obtener ubicación</button>
        <button id="btnActualizar">¿Qué hace el gato?</button>

        <p id="ubi"></p>
      </header>


      <section id="cielo">

        <div id="sun">
          <div id="datosSol"></div>
          <div class="fotoGata">
            <img src="img/taiga.jpg" alt="foto de Taiga, la gata más bonita del universo">
          </div>
        </div>

        <div id="moon">
          <div id="datosLuna"></div>
          <div class="fotoGata">
            <img src="img/sora.jpg" alt="foto de Sora, la gata más loca del universo">
          </div>
        </div>

      </section>

    </div>
  </main>

  <footer>

  </footer>

  <script src="cielo_scripts.js">

  </script>
</body>

</html>
